name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish library
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse('CraftersDisplayLibrary/pom.xml').getroot()
          version = root.findtext('{http://maven.apache.org/POM/4.0.0}version')
          if not version or not re.fullmatch(r'\d+\.\d+\.\d+(?:[A-Za-z][0-9A-Za-z]*|-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
              raise SystemExit('Library version must be a release version such as 1.2.5, 1.2.5b or 1.2.0-rc.1')
          if 'SNAPSHOT' in version.upper():
              raise SystemExit('Snapshot versions cannot be released')
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must match library version: v{version}')
          prerelease = re.fullmatch(r'\d+\.\d+\.\d+', version) is None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'prerelease={str(prerelease).lower()}\n')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            CraftersDisplayLibrary/pom.xml

      - name: Build and verify library
        run: mvn --batch-mode --no-transfer-progress -Plibrary clean verify

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "CraftersDisplayLibrary/target/CraftersDisplayLibrary-${RELEASE_VERSION}.jar" release-assets/
          cd release-assets
          sha256sum ./*.jar > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "CraftersDisplayLibrary ${RELEASE_TAG}" \
            --generate-notes \
            "${flags[@]}"
